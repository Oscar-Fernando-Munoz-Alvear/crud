<!DOCTYPE html>
<html lang="es">
<head>

<body>
    <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Validación</title>
</head>
<body>

    <div class="container">
        <h1>Registro de Usuario</h1>
        <form id="registroForm" onsubmit="return validarFormulario(event)">
            <div class="form-group">
                <label for="nombreCompleto">Nombre completo:</label>
                <input type="text" id="nombreCompleto" name="nombreCompleto" required>
                <span class="error-message" id="errorNombre"></span>
            </div>

            <div class="form-group">
                <label for="correo">Correo:</label>
                <input type="email" id="correo" name="correo" required>
                <span class="error-message" id="errorCorreo"></span>
            </div>

            <div class="form-group">
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena" required>
                <span class="error-message" id="errorContrasena"></span>
            </div>

            <div class="form-group">
                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" required>
                <span class="error-message" id="errorEdad"></span>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input type="text" id="telefono" name="telefono" required>
                <span class="error-message" id="errorTelefono"></span>
            </div>

            <button type="submit">Enviar Registro</button>
            <div class="success-message" id="mensajeExito"></div>
        </form>
    </div>
</body>
</html>
    <script src="./main.js"></script>
</body>
</html>
