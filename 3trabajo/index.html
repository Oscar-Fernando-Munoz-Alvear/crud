<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Registro de libros</title>
</head>
<body>
    <div class="container">
        <h1>Gestión de Libros (CRUD)</h1>

        <div class="form-section">
            <div class="form-group">
                <label for="titulo">Título:</label>
                <input type="text" id="titulo" placeholder="Ej: Cien años de soledad" required>
                <span class="error-message" id="errorTitulo"></span>
            </div>
            <div class="form-group">
                <label for="autor">Autor:</label>
                <input type="text" id="autor" placeholder="Ej: Gabriel García Márquez" required>
                <span class="error-message" id="errorAutor"></span>
            </div>
            <div class="form-group">
                <label for="anio">Año:</label>
                <input type="number" id="anio" placeholder="Ej: 1967" required>
                <span class="error-message" id="errorAnio"></span>
            </div>
            <div class="form-group">
                <label for="genero">Género:</label>
                <input type="text" id="genero" placeholder="Ej: Realismo mágico" required>
                <span class="error-message" id="errorGenero"></span>
            </div>
            <div class="form-group">
                <label for="isbn">ISBN (10 o 13 caracteres):</label>
                <input type="text" id="isbn" placeholder="Ej: 978-0385501202" required>
                <span class="error-message" id="errorIsbn"></span>
            </div>
            
            <button onclick="guardarLibro()">Guardar Libro</button>
        </div>

        <h2>Lista de Libros</h2>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Título</th>
                    <th>Autor</th>
                    <th>Año</th>
                    <th>Género</th>
                    <th>ISBN</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="listaLibros">
                </tbody>
        </table>
    </div>

    <script>
        
    </script>
</body>
</html>
    <script src="./main.js"></script>
</body>
</html>
